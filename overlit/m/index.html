<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OVERLIT 맵 놀이터</title>
<meta name="description" content="친구가 만든 OVERLIT 퍼즐 맵이에요. 앱에서 열어 바로 플레이해 보세요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OVERLIT">
<meta property="og:title" content="OVERLIT 맵 놀이터 · 친구가 만든 퍼즐 맵">
<meta property="og:description" content="빛을 겹쳐 길을 여는 2D·3D 퍼즐. 링크를 눌러 이 맵에 도전해 보세요!">
<style>
:root{--bg:#efebe4;--card:#fff;--ink:#262a35;--soft:#7a7f8e;--line:#e2ddd4;--gold:#f4b63f}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a18;--card:#262320;--ink:#f1ece6;--soft:#b3aaa0;--line:#3a352f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
main{max-width:480px;margin:0 auto;padding:40px 16px 56px;text-align:center}
.logo{font-weight:800;letter-spacing:.45em;font-size:22px;margin:0 0 6px;padding-left:.45em}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:28px}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.card{background:var(--card);border-radius:28px;padding:28px 20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.label{color:var(--soft);font-weight:700;font-size:14px;letter-spacing:.2em}
.code{font-size:44px;font-weight:800;letter-spacing:.12em;margin:8px 0 6px;padding-left:.12em}
.sub{color:var(--soft);font-size:15px;margin:0 0 22px}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:16px;font:inherit;font-size:18px;font-weight:700;margin-top:12px;cursor:pointer;text-decoration:none}
.primary{background:var(--ink);color:#fff}
@media (prefers-color-scheme:dark){.primary{background:#f1ece6;color:#262a35}}
.ghost{background:var(--bg);color:var(--ink)}
.how{color:var(--soft);font-size:14px;margin-top:22px}
footer{margin-top:28px;color:var(--soft);font-size:13px}
footer a{color:var(--soft)}
</style>
</head>
<body>
<main>
<p class="logo">OVERLIT</p>
<div class="dots"><i style="background:#f2545b"></i><i style="background:#f7c548"></i><i style="background:#3e7cf5"></i></div>
<section class="card">
  <div class="label" id="label">맵 놀이터</div>
  <div class="code" id="code">— — —</div>
  <p class="sub" id="sub">친구가 만든 퍼즐 맵이에요</p>
  <a class="btn primary" id="open" href="#">앱에서 열기</a>
  <a class="btn ghost" id="store" href="https://play.google.com/store/apps/details?id=com.overlit.game">Google Play에서 받기</a>
  <button class="btn ghost" id="copy" type="button">코드 복사</button>
  <p class="how" id="how">앱이 열리지 않으면: 게임 › 맵 놀이터 › 코드 입력</p>
</section>
<footer>OVERLIT · <a href="../">소개</a> · <a href="../privacy.html">개인정보처리방침</a> · <a href="../rules.html">이용 규칙</a></footer>
</main>
<script>
(function () {
  var en = !/^ko/i.test(navigator.language || "");
  var raw = (new URLSearchParams(location.search).get("c") || location.hash.replace(/^#/, "")).toUpperCase().replace(/[^A-Z0-9]/g, "");
  var ok = /^[2-9A-HJ-NP-Z]{6}$/.test(raw);
  var pretty = ok ? raw.slice(0, 3) + "-" + raw.slice(3) : "";
  var store = "https://play.google.com/store/apps/details?id=com.overlit.game";
  var t = en ? { label: "PLAYGROUND", sub: "A puzzle map made by a friend", open: "Open in the app", store: "Get it on Google Play",
                 copy: "Copy code", copied: "Copied!", how: "If the app doesn't open: game › Playground › Enter code", bad: "This link has no map code" }
             : { label: "맵 놀이터", sub: "친구가 만든 퍼즐 맵이에요", open: "앱에서 열기", store: "Google Play에서 받기",
                 copy: "코드 복사", copied: "복사했어요!", how: "앱이 열리지 않으면: 게임 › 맵 놀이터 › 코드 입력", bad: "맵 코드가 없는 링크예요" };
  document.documentElement.lang = en ? "en" : "ko";
  document.getElementById("label").textContent = t.label;
  document.getElementById("sub").textContent = ok ? t.sub : t.bad;
  document.getElementById("code").textContent = ok ? pretty : "— — —";
  document.getElementById("store").textContent = t.store;
  document.getElementById("how").textContent = t.how;
  var open = document.getElementById("open"), copy = document.getElementById("copy");
  open.textContent = t.open;
  copy.textContent = t.copy;
  if (!ok) { open.style.display = "none"; copy.style.display = "none"; return; }
  // Android: the app opens if installed, otherwise Google Play (browser_fallback_url).
  open.href = /android/i.test(navigator.userAgent)
    ? "intent://m/" + raw + "#Intent;scheme=overlit;package=com.overlit.game;S.browser_fallback_url=" + encodeURIComponent(store) + ";end"
    : "overlit://m/" + raw;
  copy.onclick = function () {
    var done = function () { copy.textContent = t.copied; setTimeout(function () { copy.textContent = t.copy; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(pretty).then(done, done); else done();
  };
})();
</script>
</body>
</html>
